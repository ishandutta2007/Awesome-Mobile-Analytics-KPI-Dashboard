<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#0284c7" stop-opacity=".1"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="line-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="card-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes dashMove{0%{stroke-dashoffset:600}}@keyframes barGrow{0%{transform:scaleY(.92)}50%{transform:scaleY(1.08)}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:17px;fill:#94a3b8}.badge-text{font-weight:600;font-size:12px;fill:#38bdf8}.badge-text,.stat-title,.stat-value{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.stat-title{font-weight:500;font-size:11px;fill:#64748b;text-transform:uppercase;letter-spacing:.5px}.stat-value{font-weight:700;font-size:16px;fill:#f1f5f9}.pulse-element{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-1{animation:floatCard1 5s ease-in-out infinite}.floating-2{animation:floatCard2 6s ease-in-out infinite}.animated-chart-line{stroke-dasharray:600;animation:dashMove 4s linear infinite}.bar-anim{transform-origin:bottom;animation:barGrow 4s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g stroke="#334155" stroke-opacity=".15" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="120" x2="1200" y1="0" y2="360"/><line x1="240" x2="240" y1="0" y2="360"/><line x1="360" x2="360" y1="0" y2="360"/><line x1="480" x2="480" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="720" x2="720" y1="0" y2="360"/><line x1="840" x2="840" y1="0" y2="360"/><line x1="960" x2="960" y1="0" y2="360"/><line x1="1080" x2="1080" y1="0" y2="360"/></g><circle cx="150" cy="80" r="140" fill="#38bdf8" class="pulse-element" filter="url(#glow)" opacity=".12"/><circle cx="1050" cy="220" r="160" fill="#a855f7" class="pulse-element" filter="url(#glow)" opacity=".15"/><circle cx="780" cy="100" r="100" fill="#6366f1" filter="url(#glow)" opacity=".1"/><g class="floating-1" transform="translate(780, 45)"><rect width="360" height="210" fill="url(#card-grad)" stroke="#334155"