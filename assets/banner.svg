 stroke="url(#line-glow)" stroke-width="3" d="M 20 60 Q 80 45, 140 25 T 280 15" class="animated-chart-line" filter="url(#glow)"/></g></g><g class="floating-2" transform="translate(710, 160)"><rect width="130" height="155" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#card-shadow)" rx="12"/><rect width="40" height="4" x="45" y="8" fill="#334155" rx="2"/><circle cx="65" cy="50" r="24" fill="none" stroke="#1e293b" stroke-width="5"/><circle cx="65" cy="50" r="24" fill="none" stroke="#38bdf8" stroke-dasharray="100 150" stroke-linecap="round" stroke-width="5"/><text x="65" y="54" fill="#fff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">94.8%</text><text x="65" y="90" class="stat-title" text-anchor="middle">Crash-Free</text><rect width="90" height="24" x="20" y="110" fill="url(#primary-glow)" opacity=".9" rx="12"/><text x="65" y="126" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE METRICS</text></g><g transform="translate(60, 60)"><rect width="210" height="28" fill="#0369a1" fill-opacity=".25" stroke="#38bdf8" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"/><text x="28" y="19" class="badge-text">📱 MOBILE ANALYTICS &amp; KPI</text><text x="0" y="82" class="title-text">Mobile Analytics &amp;</text><text x="0" y="132" fill="url(#primary-glow)" class="title-text">KPI Dashboard</text><text x="0" y="172" class="subtitle-text">Curated open-source toolkits, SDKs &amp; top SaaS platforms for</text><text x="0" y="196" class="subtitle-text">real-time user behavior, app telemetry, funnels &amp; product metrics.</text><g transform="translate(0, 222)"><rect width="132" height="26" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="66" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 Real-Time KPIs</text><rect width="135" height="26" x="142" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="209" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📱 Mobile SDKs</text><rect width="150" height="26" x="287" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="362" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Open-Source Ready</text></g></g></svg>